# ============================================================================
# kinema · 模型与风格配置（唯一真源 / single source of truth）
# ----------------------------------------------------------------------------
# 任何 skill / 脚本都从这里读取模型配置，不在代码里写死。
# 换模型、调风格、加特效 → 改这个文件即可，无需动 Python。
#
# 发现顺序（ConfigStore）：
#   1. 环境变量 KINEMA_MODELS 指定的路径
#   2. 从当前目录向上查找的 config/models.yaml
#   3. ~/.config/kinema/models.yaml
# 找不到时回退到引擎内置默认（保证 mock 离线可跑）。
#
# ★ 密钥不写在这里！请填 config/secrets.yaml（已 gitignore，安全），两把主 key 在其最上面：
#     ARK_API_KEY       图像 Seedream + 视频 Seedance（一个 key）
#     ARK_TTS_API_KEY  配音 豆包语音合成大模型 seed-tts-2.0（固定音色）
#   本文件只写 *_env/*_key_env 变量名，读取时按 环境变量 > secrets.local.json > secrets.yaml 解析。
# ============================================================================

version: 1

defaults:
  profile: narration        # 未指定 profile 时用它
  fps: 30
  # 比例不是配置项：默认主比例是引擎常量（16:9 横屏，竖屏/方形须建项时显式指定），
  # 画布尺寸见下方 canvas 段。本段不收 aspect 键：无人消费的键会误导指挥层。
  # 能力级默认 provider 别名（全局总入口）：profile 未显式指定 provider 时用它。
  # 换厂商/换模型只改这里一行（或改该别名在 providers 段的连接信息），全部 profile 零改动；
  # 单个 profile 要偏离默认时才在其能力块里写 provider（如某画风的 tts 单独指到 minimax）。
  providers:
    image: seedream           # 图像默认（多图一致性+中文理解，与视频共用 ARK key）
    video: seedance-mini  # 图生视频默认（多镜头人物一致性领先；备选 veo/minimax-h3 已接入，改此行即切）
    tts:   seedtts            # 配音默认（seed-tts-2.0 确定性固定音色，角色配音正解）
    music: elevenlabs         # BGM 默认（缺 key 自动降级本地曲库 music/）
    lipsync: volc-lipsync     # 视频改口型默认（dubbed 底片的口型精修增强步；未配 req_key/密钥时点名跳过）

canvas:                     # 各比例画布尺寸
  "9:16": [1080, 1920]
  "16:9": [1920, 1080]
  "1:1":  [1080, 1080]

# ----------------------------------------------------------------------------
# providers：各家模型的连接信息。kind ∈ image|video|tts|music。
# status: ready=已实现（全部 provider 均已接入）  planned=已登记待接入（router 会给出清晰提示）
# 能力/计费/合规详见 docs/kinema/providers.md
# ----------------------------------------------------------------------------
providers:
  # ---- 视频改口型（dubbed 增强步）----
  volc-lipsync:                    # 火山智能视觉「视频改口型」：底片+最终配音 → 只重绘口型区域
    kind: lipsync
    impl: volc_lipsync             # 实现名与 Python 模块同名（下划线），别名对用户（连字符）
    status: ready
    host: visual.volcengineapi.com # 签名式接口固定域名（路径与版本由适配器决定，无 base_url）
    # 鉴权用视觉服务 AK/SK（IAM「密钥管理」，与 ARK_API_KEY 不是同一套）；
    # 变量名在此声明，配置中心的密钥位与自检按它取
    ak_env: VOLC_ACCESS_KEY
    sk_env: VOLC_SECRET_KEY
    # req_key 标识具体算法档，只在官方接口文档给出（文档中心 → 智能视觉服务 →
    # 视觉内容生成 → 视频改口型 → 接口文档），每档一值且随版本更替——必须显式配置。
    # req_key: "<按官方接口文档填写>"
    price_per_second: 0            # CNY/秒（按控制台定价填写；0=未配置不入账）

  # ---- 图像 ----
  seedream:                        # ★ 推荐主力图像（一致性+中文+性价比，与视频/配音共用 ARK key）
    kind: image
    status: ready
    base_url: "https://ark.cn-beijing.volces.com/api/v3"
    model: "doubao-seedream-5-0-pro-260628"   # Seedream 5.0 Pro（最强档，恒用 pro）
    api_key_env: ARK_API_KEY
    # 出图像素上限（0=按画布原尺寸发，即 1920×1080 一档）。要更高清就设成正数：
    # 引擎在**保持画布宽高比不变**的前提下放大到它以内。5.0 pro 的官方总像素上限是
    # 4624220（16:9 约 2864×1611）；真 4K（829 万）本档出不了，要换 4.5。
    # 单次点名走 `gen-image --hd`，不必改这里
    max_pixels: 0
    # 官方按输出像素分两档，阈值 hd_pixels：以内按 price_per_image，超出按
    # price_per_image_hd。三种画布（1920×1080 / 1080×1920 / 1080×1080）最大 207 万
    # 像素落低档；`--hd` 或 max_pixels 放大后跨到高档，适配器按实际出图像素落账。
    # 输入参考图另有按张计费的部分，未建模
    price_per_image: 0.3            # CNY/张（≤ hd_pixels）
    price_per_image_hd: 0.6         # CNY/张（> hd_pixels）
    hd_pixels: 2360000
  nano-banana:                     # 海外效果优先图像（Gemini 图像模型，同步接口无轮询）
    kind: image
    impl: nano_banana              # 实现名与 Python 模块同名（下划线），别名对用户（连字符）
    status: ready                  # ✅ 适配器已接入（generateContent，产物 base64 内联）
    base_url: "https://generativelanguage.googleapis.com/v1beta"
    model: "gemini-3-pro-image"    # Nano Banana Pro（预览版串 -preview 已关停，勿配）
    # 更便宜的 gemini-3.1-flash-image（$0.067/1K 图）= 加别名指 impl: nano_banana，零代码
    prompt_lang: en            # 海外模型英文提示词更优（用 shots[].image_prompt_en）
    api_key_env: GEMINI_API_KEY
    image_size: "2K"               # 512/1K/2K/4K（大写 K）；gemini-2.5-flash-image 不支持须置 ""
    price_per_image: 0.95          # ≈$0.134/张(1-2K)，https://ai.google.dev/gemini-api/docs/pricing
    # ⚠️ SynthID 水印强制；无国内端点；1080x1920 需 2K 出图后由引擎重构取景
  wan:                             # 国产性价比图像备选（阿里云百炼，异步任务）
    kind: image
    status: ready                  # ✅ 适配器已接入（wan2.7 新版 messages 协议：文生图+0~9 参考图）
    base_url: "https://dashscope.aliyuncs.com/api/v1"   # 国际站 https://dashscope-intl.aliyuncs.com/api/v1（Key 与国内隔离）
    model: "wan2.7-image"          # 0.2 元/张；旗舰 wan2.7-image-pro（0.5 元/张，4K）加别名即可
    api_key_env: DASHSCOPE_API_KEY
    price_per_image: 0.2           # https://help.aliyun.com/zh/model-studio/model-pricing
    # ⚠️ 产物签名 URL 仅 24h 有效（引擎即时落盘）；wan2.5 及以下旧协议不支持

  minimax-image:                   # MiniMax 图像（image-01）：同步返回、无轮询
    kind: image
    impl: minimax_image
    status: ready                  # ✅ 适配器已接入（文生图/图生图共用一个端点）
    base_url: "https://api.minimax.io/v1"   # 国内站 https://api.minimaxi.com/v1
    model: "image-01"
    api_key_env: MINIMAX_API_KEY
    price_per_image: 0.0           # 官方 $0.0035/张（美元结算）——按控制台换算后填，0=不入账
    # ⚠️ 提示词上限 1500 字符（PromptCompiler 超限会在发送前拒绝）；参考图**每次只收一张**、只支持
    #    type=character、且只收 JPG/JPEG/PNG 且 <10MB（多垫图/四栏设定图场景请继续用 seedream）
    # ⚠️ **官方限流 10 RPM**——`gen-image --concurrency` 建议 ≤2（缺省 4 会触发 1002 限流）
    # ⚠️ 分辨率：适配器优先发 width/height 拿画布原生尺寸；比例档每一档都绑定固定像素
    #    （16:9 恒 1280×720），走那条路会让每张图都低于画布、合成时被放大发虚

  agent:                           # agent 原生生图 · 工单模式：引擎开单、驱动引擎的 AI 产图
    kind: image                    # 零密钥零端点零 API 成本；generate() 不发任何网络请求
    status: ready                  # 路由三级解析见 models.image_route：
    impl: agent                    #   显式激活 > KINEMA_AGENT_IMAGEGEN=1 声明 > 默认 provider
    price_per_image: 0.0           # 图由 agent 自产，不入账

  # ---- 视频（图生视频，形态B；kenburns 模式零视频成本，dubbed 对口型仅 seedance 支持）----
  veo:                             # Google Veo 3.1 图生视频备选（原生音画恒开，适合 native 模式）
    kind: video
    status: ready                  # ✅ 适配器已接入（predictLongRunning + operation 轮询）
    base_url: "https://generativelanguage.googleapis.com/v1beta"
    model: "veo-3.1-fast-generate-preview"   # 现役三档 standard/fast/lite（3.0/2.0 已关停）
    prompt_lang: en
    api_key_env: GEMINI_API_KEY
    resolution: "720p"             # 720p/1080p/4k；⚠️ 非 720p 强制 8s（4~6s 短镜只能 720p）；CLI --resolution 4k 同样须 --yes
    price_per_second: 0.72         # fast 720p ≈$0.10/s，https://ai.google.dev/gemini-api/docs/pricing
    price_per_second_4k: 2.16      # fast 4k ≈$0.30/s（同上定价页）；0=回落基准价
    # ⚠️ 时长枚举 4/6/8s；比例仅 16:9/9:16；产物 2 天清理（引擎即时落盘）；不支持 dubbed 对口型；无国内端点
  seedance-mini:                   # ★ 推荐主力视频（多镜头人物一致性领先，与图像共用 ARK key）
    # 双模型策略：本别名=mini（**缺省主力**，日常量产全走它）；要上 2.5 大模型须
    # **显式点名** `gen-video --video-provider seedance-2.5` 或章节文档顶层 `video_provider`
    # ——大模型不做静默升级（成本与出片风格都不该被悄悄换掉）
    kind: video
    impl: seedance                 # 适配器实现名（别名带型号、实现不带——换型号不动代码）
    status: ready                  # ✅ 适配器已接入（异步任务：建任务→轮询→取 video_url）
    base_url: "https://ark.cn-beijing.volces.com/api/v3"
    model: "doubao-seedance-2-0-mini-260615"  # Seedance 2.0 mini（原生音频 + 首尾帧 + 多镜一致）
    api_key_env: ARK_API_KEY
    resolution: "720p"             # ⚠️ mini 只支持 480p/720p（i2v 传 1080p 实测 400 InvalidParameter）
    resolutions: ["480p", "720p"]  # 官方参数表：mini 可选 480p/720p；缺这个键本地白名单闸整条不生效
    timeline_unit: shot            # 2.0 系列不响应精确秒段：官方指南明写「支持不稳定，强行限制
                                   # 时长可能导致生成结果异常」。本档的分段发不带时间的顺序编号，
                                   # 段头措辞口径在 providers/base.py
    supports_seed: false           # 官方 seed 支持列表只到 1.5 pro / 1.0 系列，2.0 起不再支持
    supports_camera_fixed: false   # 同上
    supports_last_frame: true      # ✅ 首尾帧衔接可用（本档是衔接链的主力）
    max_ref_audios: 3              # 音色锚定：全模态参考音频 ≤3 条（实测：嗓音跟随锚定、
    max_ref_audio_seconds: 15      # 双音频按编号分绑角色/旁白成立；合计 >15s 建任务即 400）
    price_per_second: 0.5          # mini 无 1080p 档，此价即其可用档；单价以控制台为准
    #   带参考视频的 V2V 请求，输入视频秒同样按此单价入账（12s 段 + 12s 输出 = 24s）
    # 4K 档单价：0 或不配 = 回落 price_per_second（4K 报价会低估，务必配真值再用 4K）
    price_per_second_4k: 1.0       # ⚠️ mini 无 4K 档——要 4K 请点名 seedance-2.5；此值仅防误配回落用
  seedance-2.0-fast:               # Seedance 2.0 fast（点名才用：性价比档；一镜一片的纪律不变）
    kind: video
    status: ready
    impl: seedance                 # 复用 seedance 适配器（同端点同请求体，零代码）
    base_url: "https://ark.cn-beijing.volces.com/api/v3"
    model: "doubao-seedance-2-0-fast-260128"
    api_key_env: ARK_API_KEY
    resolution: "720p"
    resolutions: ["480p", "720p"]  # fast 档无 1080p/4K
    min_duration: 4
    max_duration: 15               # 2.0 系列上限 15s
    supports_seed: false           # 官方 seed 支持列表只到 1.5 pro / 1.0 系列，2.0 起不再支持
    supports_camera_fixed: false   # 同上
    supports_last_frame: true      # ✅ 官方能力表列「首尾帧生视频」，与 2.0 系列同档
    timeline_unit: shot            # 同 mini：2.0 系列不发秒段，分段走顺序编号
    max_ref_audios: 3              # 音色锚定：2.0 系列同额（≤3 条、合计 ≤15s）
    max_ref_audio_seconds: 15
    price_per_second: 0.8          # 刊例价估值；限时 75 折约 0.6 元/秒（720p），实价以账单为准
    price_per_second_4k: 0

  seedance-2.5:                    # Seedance 2.5 大模型（点名才用：复杂调度/高一致性要求的镜）
    kind: video
    status: ready
    impl: seedance                 # 复用 seedance 适配器（同端点同请求体，零代码）
    base_url: "https://ark.cn-beijing.volces.com/api/v3"
    model: "doubao-seedance-2-5-260628"
    api_key_env: ARK_API_KEY
    # 开放档位随官方调整：加档只需改 resolution 与 resolutions，适配器不动
    resolution: "720p"
    resolutions: ["480p", "720p", "1080p"]  # 官方参数表已开放 1080p（10bit HEVC）；本地白名单先拦
    max_ref_audios: 10             # 2.5 全模态参考放宽：音频 ≤10 条、合计 ≤30s（且支持纯音频输入）
    max_ref_audio_seconds: 30
    min_duration: 4                # 单次生成时长下限（秒）
    max_duration: 30               # 2.5 放开到 30s（2.0/mini 仍是 15s，缺省值即 15）
    #   ⚠️ 这个值钳的是请求体的 duration：配小了不会报错、只会**静默截断**，
    #      钱按截断后的秒数付而你以为拿到了更长的片段。改档位前先核对控制台。
    #   它只管输出时长。参考视频（3D 预演 / 深度控制视频）的输入侧上限恒是 15 秒，
    #      与本值无关——`control bind` 的 4~15 秒段长在 2.5 上照样成立。
    # 2.5 的**受限任务类型**（首帧/首尾帧、视频编辑、视频延长，以及带参考视频的 V2V）
    # 只接受 adaptive；纯参考图任务官方示例是显式 "ratio":"16:9"，适配器按任务类型
    # 分别发，见 seedance.py。V2V 发 adaptive 意味着成片几何跟参考视频走，深度控制段
    # 因此在裁段时就先贴合章节画布
    ratio_mode: adaptive
    supports_last_frame: true      # ✅ 首尾帧衔接可用（受限任务类型，ratio 恒 adaptive）
    supports_seed: false           # 2.5 参数表无 seed
    supports_camera_fixed: false   # 2.5 参数表无 camera_fixed
    timeline_unit: second          # 2.5 响应整数秒时间戳（官方「与 2.0 的差异点」第一条）
    price_per_second: 1.51         # 官方价格表 720p 刊例（本别名缺省档）；V2V 的输入视频秒同样入账
    price_per_second_1080p: 3.74   # 按档单价：--resolution 1080p 时报价、事前闸与台账都按它
    price_per_second_4k: 0         # 2.5 无 4K 档；0=回落基准价，与 fast 档同口径

  minimax-h3:                      # MiniMax H3（全模态 v2 接口）：首尾帧 + 参考生成 + 原生立体声
    kind: video
    impl: minimax_video            # 适配器实现名（别名可随型号换，实现不变）
    status: ready                  # ✅ 适配器已接入（v2：建任务→轮询→直取 content.url，比 v1 少一段换取）
    base_url: "https://api.minimax.io/v2"   # 国内站 https://api.minimaxi.com/v2（两站账号与计费独立，key 不通用）
    model: "MiniMax-H3"            # 官方 model 枚举唯一值；「海螺 3.0」是 App 侧别名
    resolution: "768P"             # 官方只有 768P / 2K 两档
    api_key_env: MINIMAX_API_KEY
    # ⚠️ 官方按秒计价且**美元结算**（2K $0.13/s、768P $0.08/s，输入视频秒同样入账）。
    #    这里留 0 = 不入成本台账（避免把一个汇率估算值当成精确数字写进账）；
    #    请按你账号所在站的控制台实时价换算后填一行，预算闸才对它生效。
    #    https://platform.minimax.io/docs/guides/pricing-paygo
    price_per_second: 0.0          # 官方美元口径 768P $0.08/s · 2K $0.13/s——按汇率换算后填，0=不入账
    price_per_second_4k: 0.0       # H3 没有 4K 档（枚举只到 2K），此位仅防误配回落
    # ⚠️ 时长 4~15 秒且只收整数（超出会被钳制并告警）；比例枚举 adaptive/21:9/16:9/4:3/1:1/3:4/9:16
    # ⚠️ 输出恒带原生立体声（与画面由同一模型联合生成），官方无关闭开关 → 适合 native 模式
    # ⚠️ 素材传法：官方指南说「需通过 URL 传入」但未明确禁止 base64，适配器先走 data-url，
    #    被拒时报错会指向媒体上云——**接入后请用一镜小样确认一次**
  minimax-h3-local:                # H3 自托管（开源权重 H3-Base，封顶 768p）
    kind: video
    impl: minimax_video
    status: planned                # 登记位：点名会给出清晰报错，不会静默走错
    # ⚠️ 官方**不提供**本地 HTTP 契约：README 只给 serve 启动命令。实际协议由推理框架决定，
    #    而 SGLang（JSON + file:// 素材 + 独立 /content 下载）与 vLLM-Omni（multipart + /sync 直返）
    #    两份社区契约互不兼容且随版本漂移。要接必须先锁框架版本并小样验证。
    # ⚠️ 只开源了 H3-Base（33B，产 768p），Context-IR 提示词增强与 2K 上采未开源、仅云端 API 有；
    #    官方示例统一 4 卡（参考机 4×H200），不是单卡消费级能跑的东西。
    # ⚠️ 许可证 MiniMax H3 Community License：自托管权重的 Applicable Territory **不含**
    #    欧盟/英国/韩国/美国（该条只约束权重，不约束云端 API）；年营收超 2000 万美元的商用
    #    须事先取得书面授权；分发须附 NOTICE 且商用产品界面须显著展示 "MiniMax H3"。
    base_url: "http://127.0.0.1:30010/v1"
    model: "MiniMax-H3"
    auth: none                     # 自托管端点通常无鉴权：适配器据此不发 Authorization 头

  # ---- 配音 ----
  seedtts:                         # 模版音色 · 豆包语音合成大模型 seed-tts-2.0（HTTP SSE，固定音色）
    kind: tts
    status: ready
    # 确定性固定音色：uranus 2.0 音色，同一 speaker 全程同一把声音。显式例外路径
    # （voice audition → voice use）；缺省选角走 doubao 的定制生成
    # base_url 统一以 API 版本号结尾（/api/v3、/v1…），端点路径由适配器拼接
    base_url: "https://openspeech.bytedance.com/api/v3"
    resource_id: "seed-tts-2.0"           # 决定用 2.0 音色 + 字符版计费（不占并发额度）
    voice: "zh_female_vv_uranus_bigtts"
    format: "mp3"
    sample_rate: 24000
    # ⚠️ TTS 用独立语音凭证，非 ARK_API_KEY！控制台 console.volcengine.com/speech
    api_key_env: ARK_TTS_API_KEY         # 新版控制台单头鉴权 X-Api-Key
    # 字符版计费单价（CNY/千字符）。缺省填后付费刊例价；资源包/商务价在
    # models.local.json 覆盖。0 = 不入成本台账
    price_per_kchar: 0.3
  doubao:                          # 豆包音频生成 seed-audio-1.0（生成式；**「定制生成」的落点**——按自然语言声线描述造音色，靠参考音频锚定不漂移）
    kind: tts
    status: ready
    base_url: "https://openspeech.bytedance.com/api/v3"
    model: "seed-audio-1.0"
    voice: "zh_female_vv_uranus_bigtts"   # 豆包 2.0 大模型音色
    format: "mp3"
    sample_rate: 24000
    api_key_env: ARK_TTS_API_KEY
    # 官方以 original_duration（模型输出原始时长，上限 120s）计费，故秒价优先；
    # 两个都是 0 = 未配置不入账。按你账号的控制台实时价填其一即可让台账完整。
    price_per_second: 0.0
    price_per_kchar: 0.0
  minimax:                         # 备选配音（多角色表现力强）
    kind: tts
    status: ready
    base_url: "https://api.minimax.io/v1"   # 国内站 https://api.minimaxi.com/v1
    model: "speech-2.8-hd"                  # 现役旗舰（2.6/02 已 legacy）
    # 不钉 voice：两站系统音色 ID 是两套互不相通的命名（国内 male-qn-qingse 一类
    # 拼音短名 / 国际 Chinese (Mandarin)_Xxx 长名），缺省由适配器按 base_url 所在站
    # 分派。要锁定音色在此加 voice: 键，值必须取自当前站的系统音色表
    api_key_env: MINIMAX_API_KEY
    group_id_env: MINIMAX_GROUP_ID   # 现行文档两站均未载此参数，仅为兼容历史网关保留
    # 量纲陷阱：官方国内站按**万字符**报价（speech-2.8-hd 3.5 元/万字符 → 此处填 0.35）；
    # 国际站按美元/百万字符（$100/M chars）需按汇率换算后再填。0=不入账
    price_per_kchar: 0.0                  # 同 seedtts：0=未配置不入账

  # ---- 背景音乐 ----
  elevenlabs:                      # 有 ELEVENLABS_API_KEY 用它；为空则自动切 local
    kind: music
    status: ready
    base_url: "https://api.elevenlabs.io/v1"
    model: "music_v2"              # 不显式钉死会落平台过渡期缺省 music_v1
    api_key_env: ELEVENLABS_API_KEY
    price_per_min: 0.0             # 官方 API 口径 $0.15/分钟——按汇率换算后填，0=不入账
    # output_format 缺省 mp3_44100_128（适配器钉死，覆盖层可改）；SFX 时长上限 30s
  minimax-music:                   # MiniMax 音乐（music-3.0）：同步返回、按首计费
    kind: music
    impl: minimax_music
    status: ready                  # ✅ 适配器已接入（本工程只用纯器乐档 is_instrumental）
    base_url: "https://api.minimax.io/v1"   # 国内站 https://api.minimaxi.com/v1
    model: "music-3.0"             # 另有 music-2.6 / music-cover（翻唱）与三个 -free 免费档
    api_key_env: MINIMAX_API_KEY
    price_per_track: 0.0           # 官方按首一口价（国内 ¥1.0/首 · 国际 $0.15/首，至多 5 分钟）
                                   # ——0=不入账；按你账号所在站的控制台填。
                                   # **没有「按分钟」这个计费维度**，别用 price_per_min
    # ⚠️ 开通限制：官方自 2026-08-20 起付费音乐接口不再对新用户开放（存量账号可用）
    #    ——新账号开不了通道时改用 elevenlabs 或 local 曲库
    # ⚠️ 限流：music-3.0 为 120 RPM，免费档 music-3.0-free 只有 3 RPM（业务码 1002=限流可重试）
    # ⚠️ **时长不是请求参数**：官方按 prompt/lyrics 生成，没有"给我 60 秒"这样的字段；
    #    产物短于需要时 compose 会循环铺满并告警
    # ⚠️ prompt ≤2000 字符、lyrics ≤3500 字符（支持 [verse]/[chorus] 段落标签）

  local:                           # 本地免版权音乐库（music/，零成本、商用安全）
    kind: music
    status: ready

# ----------------------------------------------------------------------------
# profiles：命名“风格档”。把一组模型 + 风格前缀 + 默认特效 + 节奏 绑定起来。
# genre skill 只引用 profile 名字，不关心底层用哪个模型。
#   image.style_prefix → 引擎会自动拼到每个分镜的 image_prompt 前，统一美术风格
#   effects            → 该风格默认叠加的特效（可被 project.effects 覆盖）
#   pacing             → 建议分镜数/节奏（供 skill 参考）
# ----------------------------------------------------------------------------
# ⚠️ style_prefix 的写作边界（写新画风档 / 改 project.style_prompt 前必读）：
#   前缀会被**无差别拼进每一镜**（分镜图/设定图/封面统一取它），所以它只准写
#   **媒介与质感**——媒介、材质、光学、调色、颗粒、时代质感。
#   **绝不许写构图、机位景别、或画面里有什么主体**（「地平线压低」「占画面几分之几」
#   「负空间在哪」「人在画面中极小」）——那些是 shots[].image_prompt / framing / angle
#   的活，写进前缀 = 给全片下同一条构图令，各不相同的分镜会一起坍缩成同一张图。
#   落笔自问：**这句话换一个镜头还成立吗？**
#   本条没有自动守卫（词表既误伤"清晰构图"这类质感陈述、又漏抓真事故），只能靠人。
profiles:
  narration:                       # 形态A · 通用口播（默认）
    label: "口播"
    image: { style_prefix: "" }
    effects: []
    pacing: { shots: "5-10", note: "一句一观点，每 2-3 秒一个画面" }

  anime:                           # 动漫默认（现代新番·数字作画华丽光效，kn-anime 未点名画风即用它）
    label: "现代新番"
    image:
      style_prefix: "现代日本新番动画风格，数字作画高精度锐利线条，高饱和色彩设计与明暗二分，高密度粒子特效与镜头光效演出（碎光拖尾、层叠辉光），大透视与倾斜地平线的动态构图，ufotable 式打光与镜头景深，2020年代顶级制作画质，"
      style_prefix_en: "modern Japanese seasonal anime style, high-precision digital linework, high-saturation color design with crisp two-tone shading, dense particle and lens-flare effects with trailing sparks and layered glow, wide-angle perspective and tilted-horizon compositions, ufotable-style lighting and lens depth, 2020s top-tier production quality, "
    music: { mood: cinematic }
    effects: [bloom]
    subtitle: { mode: caption, size: 60, outline: 5, outline_color: "#101018", accent: "#7fd4ff", speaker_tag: false }   # 画风字幕样式（后置烧录，画面本体无字）
    pacing: { shots: "6-12", note: "快节奏演出，高光镜头给足特效" }

  anime_cel:                       # 赛璐璐（经典平涂轮廓线，kn-anime 画风变体）
    label: "赛璐璐"
    image:
      style_prefix: "日式赛璐璐动画风格，鲜明清晰的轮廓线，扁平上色，高饱和度，二次元人物设定，"
      style_prefix_en: "Japanese cel anime style, clean crisp outlines, flat cel shading, high saturation, anime character design, "
    tts:   { voice: 活力少女 }
    effects: []
    subtitle: { mode: caption, size: 60, outline: 5, outline_color: "#1b1b1b", accent: "#ffd45e", speaker_tag: false }   # 画风字幕样式（后置烧录，画面本体无字）
    pacing: { shots: "6-12", note: "分镜偏多，强调角色一致与镜头感" }

