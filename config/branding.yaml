# ============================================================================
# kinema · 白标品牌（系统卖断交付用）
# ----------------------------------------------------------------------------
# 买家改这三行即可换牌：Studio 大屏（左上品牌区 + 浏览器标题 + 主题强调色）、
# 项目提案书、静态审阅包页脚同步生效——代码零改动。
#   name     品牌名（默认 Kinema）
#   tagline  口号/副标（默认 PRODUCTION STUDIO）
#   accent   主题强调色，#RRGGBB（缺省用自带琥珀色；非法值自动忽略）
# ============================================================================

name: Kinema
tagline: PRODUCTION STUDIO
# accent: "#4cc3d9"

# ----------------------------------------------------------------------------
# 动态水印（防搬运）：`kinema watermark --chapter <项目>/<章节>` 给成片叠加
# 沿随机路线漂移的半透明文案，水印版 <id>_wm_<比例>.mp4 与原片并存。
# 文案解析链：CLI --text > project.json 顶层 "watermark" > 此处 text（全局默认）。
# text 为空 = 无全局默认（命令会要求给文案）。路线由 seed 确定性生成，重打同款。
# ----------------------------------------------------------------------------
watermark:
  text: "@翼宿"           # 全局默认文案（留空=不设默认）
  opacity: 0.42           # 透明度 0~1（越低越隐性；柔和投影保证暗底可读）——略实一点更清晰但不抢戏
  # size: 42              # 字号（缺省按画面高度 2.2% 自适应，克制不抢戏）
  speed: 3.0              # 漫游基准速度（画面尺寸的 %/秒）；每次碰壁反弹在 0.6~1.3 倍内随机变速
  fade: 0.6               # 入场淡入秒数（仅出现时一次；此后全程在场连续漫游，绝不消失）
  color: white            # 文字颜色（黑色柔和投影，亮暗场景皆可读）

# ----------------------------------------------------------------------------
# 固定角标水印（品牌署名，**字幕式烧录**）：与上面的漂移水印互补——钉死在四角之一
# 全程不动，清晰不透明、字号比字幕小四号、贴边细描边。可与漂移水印同时开（一次重编码一起烧）。
# 文案解析链：CLI --corner-text > project.json "watermark_fixed".text > 此处 text。
# 位置解析链：CLI --corner-pos > project.json "watermark_fixed".position > 此处 position。
# ----------------------------------------------------------------------------
watermark_fixed:
  text: "本视频由AI创作生成"  # 全局默认角标文案（AI 生成内容标识；留空=默认不加固定角标，仅项目/CLI 显式启用）
  position: br            # 固定位置：tl 左上 / tr 右上 / bl 左下 / br 右下（缺省右下）
  # size: 30              # 字号（缺省=该项目字幕字号 ×0.52「小四号」；也可这里直给绝对像素）
  opacity: 1.0            # 不透明度（缺省 1.0 完全不透明——「不要透明模糊，要高清」）
  color: white            # 文字颜色（配细锐黑描边，任意背景清晰可读）
  # font: ""              # 字体路径（缺省=工程内置阿里普惠体 Regular·免费商用·随仓库分发跨系统一致；
                          #          小字号比宋体清晰专业。填绝对路径可换任意字体）

# ----------------------------------------------------------------------------
# 底部水印（半透明常驻署名）：固定在画面底部正中、位于字幕底带下方互不重叠，
# 半透明、无描边无底衬——优雅的常驻署名。可与漂移/角标任意组合（一次重编码一起烧）。
# 文案解析链：CLI --bottom-text > project.json "watermark_bottom".text > 此处 text。
# ----------------------------------------------------------------------------
watermark_bottom:
  text: "— 翼宿 —"        # 全局默认文案（留空=默认不加底部水印，仅项目/CLI 显式启用）
  # size: 30              # 字号（缺省按画面自适应）
  # opacity: 0.55         # 不透明度（缺省 0.55 半透明常驻）
  # color: white          # 文字颜色
  # margin: 24            # 离底边距离（像素，缺省自适应）
