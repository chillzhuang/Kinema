# ============================================================================
# 角色音色表 —— 豆包语音合成大模型 2.0（seed-tts-2.0 的 speaker，固定音色·零漂移）
# ----------------------------------------------------------------------------
# 用法：
#   · project.json 的 voices 把角色名映射到这里的别名（或直接写 voice_type）
#   · 各镜 shots[].speaker 填角色名 → 引擎解析为固定音色（同一角色全程一致）
#   · 别名不在表里时按 voice_type 原样使用
#
# 只收录「2.0 音色」——角色扮演 `ICL_uranus_*_tob` + `*_uranus_bigtts`，用于 seed-tts-2.0。
#
# 本表面向【情景剧 / 角色扮演 / 剧情短视频 / 有声漫】：
#   · 【★精选·角色扮演】= ICL 角色化音色，带人设、多情感、专为剧情对白设计（猫箱/豆包同款）——模版路径的首选池。
#   · 【旁白/独白·口播】= 通用口语音色，仅剧中旁白/内心独白/解说用（Vivi/云舟 等）。
#   · 【⚠️有声阅读/播音腔】= 番茄小说朗读腔（擎苍/少年梓辛等），戏剧但机械，慎用于日常对话。
#   · 情绪增强：合成时可用 seed-tts-2.0-expressive 模型 + additions.context_texts 传自然语言情景/语气描述。
# ============================================================================
