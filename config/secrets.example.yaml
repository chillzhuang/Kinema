# ============================================================================
# kinema · 密钥配置模板
# ----------------------------------------------------------------------------
# 用法：把本文件复制为同目录的 config/secrets.yaml，填入你的 key 即可。
#       config/secrets.yaml 已被 .gitignore 忽略，绝不会提交到 git（安全）。
# 读取优先级：同名【环境变量】> config/secrets.yaml。留空的项视为未配置。
# ============================================================================

# ★★★ 主用两把 key —— 填这两个就能跑「图像 + 视频 + 配音」整条流程 ★★★
# 创建入口：https://console.volcengine.com/ark →「API Key 管理」
ARK_API_KEY: ""            # 图像 Seedream 5.0 Pro + 视频 Seedance 2.0（火山方舟，一个 key 通用）
# 创建入口：https://console.volcengine.com/speech （火山语音控制台，开通语音大模型后建 key）
ARK_TTS_API_KEY: ""        # 音频/配音 豆包 seed-audio-1.0（火山语音·独立凭证，非 ARK_API_KEY）

# ---- 背景音乐 ----
# 申请：https://elevenlabs.io/app/settings/api-keys
ELEVENLABS_API_KEY: ""     # ElevenLabs Music（BGM）；不填则用 mock/正规曲库

# ============================================================================
# 以下为其他平台/备选（按需填，不用留空即可）
# ============================================================================

# 配音备选 · MiniMax speech-2.8
# 申请：国际站 https://platform.minimax.io / 国内站 https://platform.minimaxi.com
#      →「账户管理 · 接口密钥」（两站账号与 key 互不通用，端点也要配对应站）
MINIMAX_API_KEY: ""
MINIMAX_GROUP_ID: ""

# 口型精修（dubbed 增强步）· 火山智能视觉「视频改口型」，AK/SK 与 ARK_API_KEY 不是同一套
# 申请：https://console.volcengine.com/iam/keymanage/ （IAM 密钥管理）
# 不配置也能出片：口型精修点名跳过，对白镜按底片口型出片
VOLC_ACCESS_KEY: ""
VOLC_SECRET_KEY: ""

# 备选图像/视频（适配器已接入，填 key 即用）
# 申请：https://aistudio.google.com/apikey
GEMINI_API_KEY: ""         # Nano Banana Pro（图）/ Veo 3.1（视频），同一把 key
# 申请：https://bailian.console.aliyun.com →「API-KEY」
DASHSCOPE_API_KEY: ""      # 通义万相（图），阿里云百炼控制台（国内/国际站 key 隔离）

# 微信读书官方 Agent Gateway（kn-book 图书说书 skill 取料专用，指挥层读取、引擎不消费）
# 申请入口：https://weread.qq.com/r/weread-skills（登录微信读书账号即可申请，wrk- 前缀）
# 不配置也能用 kn-book——自动降级公开页取料（推荐值/评价人数/出版社/目录照样有），
# 但拿不到完整热门划线金句榜、中差评分档与书架/笔记独家素材
WEREAD_API_KEY: ""

# MySQL 持久化密码（backend=mysql 时使用，见 config/storage.yaml）
KINEMA_MYSQL_PASSWORD: ""

# OSS 媒体上云。桶与区域也放这里而不是 storage.yaml——后者随仓库分发，填进去
# 的桶名会跟着提交。参考视频与口型精修只要这几项齐备就能按需上传，无须把
# storage.yaml 的 backend 改成 oss（那是整份工作区搬家）。
KINEMA_OSS_ACCESS_KEY: ""
KINEMA_OSS_SECRET_KEY: ""
KINEMA_OSS_BUCKET: ""
KINEMA_OSS_REGION: ""            # 如 cn-hangzhou / ap-guangzhou / cn-beijing
KINEMA_OSS_ENDPOINT: ""          # 可选，覆盖默认 endpoint
KINEMA_OSS_PUBLIC_BASE: ""       # 可选，自定义/CDN 访问域名
